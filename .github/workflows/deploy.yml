name: Deploy app preview
# Uploading bundle/preview.zip from the GitHub web UI publishes the demo (mock API, no real data) to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['bundle/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          mkdir -p _site
          cat bundle/preview.zip* > /tmp/p.zip
          unzip -o -q /tmp/p.zip -d _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
